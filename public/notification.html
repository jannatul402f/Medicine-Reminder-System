<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications - Medicine Reminder</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f8fc;
    color: #183b56;
}

nav {
    background: linear-gradient(135deg, #1769aa, #2995d6);
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.nav-links {
    display: flex;
    gap: 10px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 20px;
}

.nav-links a:hover {
    background: rgba(255,255,255,0.2);
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

.title {
    text-align: center;
    margin-bottom: 30px;
}

.title h1 {
    color: #1769aa;
    font-size: 32px;
    margin-bottom: 8px;
}

.title p {
    color: #6c8494;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 7px 22px rgba(23,105,170,0.10);
    margin-bottom: 25px;
}

.card h2 {
    color: #1769aa;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5e4ed;
    border-radius: 10px;
    outline: none;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
textarea:focus {
    border-color: #2995d6;
}

button {
    border: none;
    border-radius: 9px;
    padding: 12px 20px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    width: 100%;
    background: linear-gradient(135deg, #1769aa, #2995d6);
    color: white;
}

.generate-btn {
    width: 100%;
    margin-top: 12px;
    background: #eaf6fc;
    color: #1769aa;
}

.notification {
    background: #f8fcff;
    border-left: 5px solid #2995d6;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.notification h3 {
    color: #1769aa;
    margin-bottom: 8px;
}

.notification p {
    color: #61798a;
    margin: 5px 0;
}

.delete-btn {
    margin-top: 10px;
    background: #e74c3c;
    color: white;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #78909c;
}

</style>

</head>

<body>

<nav>

<div class="logo">
💊 Medicine Reminder System
</div>

<div class="nav-links">

<a href="dashboard.html">Dashboard</a>

<a href="index.html">Home</a>

<a href="#" onclick="logout()">Logout</a>

</div>

</nav>


<div class="container">

<div class="title">

<h1>🔔 Notification System</h1>

<p>Manage your medicine notifications</p>

</div>


<!-- ADD NOTIFICATION -->

<div class="card">

<h2>➕ Create Notification</h2>

<form id="notificationForm">

<div class="form-group">

<label>Medicine Name</label>

<input
type="text"
id="medicine"
placeholder="e.g. Paracetamol"
required
>

</div>


<div class="form-group">

<label>Message</label>

<textarea
id="messageText"
placeholder="e.g. Time to take your medicine"
required
></textarea>

</div>


<div class="form-group">

<label>Date</label>

<input
type="date"
id="date"
required
>

</div>


<div class="form-group">

<label>Time</label>

<input
type="time"
id="time"
required
>

</div>


<button
type="submit"
class="save-btn">

🔔 Save Notification

</button>

</form>

<div id="message"></div>

<button
class="generate-btn"
onclick="generateNotifications()">

⚡ Generate From Reminders

</button>

</div>


<!-- SAVED NOTIFICATIONS -->

<div class="card">

<h2>📋 Saved Notifications</h2>

<div id="notificationList">

<div class="empty">
Loading notifications...
</div>

</div>

</div>

</div>


<script>

/* LOGIN PROTECTION */

if (localStorage.getItem("loggedIn") !== "true") {

window.location.href = "login.html";

}


/* DEFAULT DATE */

document.getElementById("date").value =
new Date().toISOString().split("T")[0];


/* SAVE NOTIFICATION */

document.getElementById("notificationForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const message =
document.getElementById("message");


const data = {

medicine:
document.getElementById("medicine").value,

message:
document.getElementById("messageText").value,

date:
document.getElementById("date").value,

time:
document.getElementById("time").value,

sent: "No"

};


try {

const response = await fetch(
"/api/notifications",
{
method: "POST",

headers: {
"Content-Type": "application/json"
},

body: JSON.stringify(data)

});


const result =
await response.json();


if (result.success) {

message.style.color = "green";

message.textContent =
"✅ Notification saved successfully!";

document.getElementById(
"notificationForm"
).reset();

document.getElementById("date").value =
new Date().toISOString().split("T")[0];

loadNotifications();

} else {

message.style.color = "red";

message.textContent =
result.message;

}

} catch (error) {

message.style.color = "red";

message.textContent =
"❌ Server error.";

}

});


/* LOAD NOTIFICATIONS */

async function loadNotifications() {

const list =
document.getElementById(
"notificationList"
);

try {

const response =
await fetch("/api/notifications");

const data =
await response.json();


if (
!data.success ||
data.notifications.length === 0
) {

list.innerHTML = `
<div class="empty">
No notifications available.
</div>
`;

return;

}


list.innerHTML = "";


data.notifications.forEach(item => {

list.innerHTML += `

<div class="notification">

<h3>🔔 ${escapeHtml(item.medicine)}</h3>

<p>
<strong>Message:</strong>
${escapeHtml(item.message)}
</p>

<p>
<strong>Date:</strong>
${escapeHtml(item.date || "Not set")}
</p>

<p>
<strong>Time:</strong>
${escapeHtml(item.time || "Not set")}
</p>

<p>
<strong>Status:</strong>
${escapeHtml(item.sent || "No")}
</p>

<button
class="delete-btn"
onclick="deleteNotification(${item.id})">

🗑 Delete

</button>

</div>

`;

});

} catch (error) {

list.innerHTML = `
<div class="empty">
Unable to load notifications.
</div>
`;

}

}


/* DELETE */

async function deleteNotification(id) {

if (
!confirm(
"Are you sure you want to delete this notification?"
)
) {

return;

}


try {

const response =
await fetch(
`/api/notifications/${id}`,
{
method: "DELETE"
}
);

const result =
await response.json();


if (result.success) {

loadNotifications();

} else {

alert("Failed to delete notification.");

}

} catch (error) {

alert("Server error.");

}

}


/* GENERATE FROM REMINDERS */

async function generateNotifications() {

try {

const response =
await fetch(
"/api/notifications/generate",
{
method: "POST"
}
);

const result =
await response.json();


if (result.success) {

alert(result.message);

loadNotifications();

} else {

alert(result.message);

}

} catch (error) {

alert("Server error.");

}

}


/* HTML PROTECTION */

function escapeHtml(text) {

if (!text) return "";

return String(text)
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}


/* LOGOUT */

function logout() {

localStorage.removeItem("loggedIn");

localStorage.removeItem("currentUser");

window.location.href = "login.html";

}


/* LOAD */

loadNotifications();

</script>

</body>

</html>
