<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dosage Schedule - Medicine Reminder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 16px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h1 {
            margin-bottom: 10px;
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .dosage-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
            background: #fafafa;
        }

        .dosage-item h4 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #2563eb;
        }

        .dosage-item p {
            margin: 7px 0;
        }

        .delete-btn {
            width: auto;
            margin-top: 12px;
            padding: 9px 16px;
            background: #dc2626;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <h2>
            Medicine Reminder
        </h2>

        <a href="dashboard.html">
            Dashboard
        </a>

    </nav>



    <!-- MAIN -->

    <div class="container">


        <div class="card">

            <h1>
                Dosage Schedule
            </h1>

            <p>
                Add and manage your medicine dosage schedule.
            </p>

        </div>



        <!-- ADD DOSAGE -->

        <div class="card">

            <h3>
                Add Dosage Schedule
            </h3>


            <form id="dosageForm">


                <!-- MEDICINE -->

                <label for="medicineName">
                    Medicine
                </label>

                <select
                    id="medicineName"
                    required>

                    <option value="">
                        Select Medicine
                    </option>

                </select>



                <!-- DOSE -->

                <label for="dose">
                    Dose
                </label>

                <input
                    type="text"
                    id="dose"
                    placeholder="Example: 1 tablet"
                    required>



                <!-- TIME -->

                <label for="time">
                    Time
                </label>

                <input
                    type="time"
                    id="time"
                    required>



                <!-- MEAL -->

                <label for="mealInstruction">
                    Meal Instruction
                </label>

                <select
                    id="mealInstruction"
                    required>

                    <option value="">
                        Select Instruction
                    </option>

                    <option value="Before Meal">
                        Before Meal
                    </option>

                    <option value="After Meal">
                        After Meal
                    </option>

                    <option value="With Meal">
                        With Meal
                    </option>

                    <option value="Anytime">
                        Anytime
                    </option>

                </select>



                <!-- BUTTON -->

                <button type="submit">
                    Save Dosage Schedule
                </button>


            </form>



            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


        </div>



        <!-- SAVED DOSAGES -->

        <div class="card">

            <h3>
                Saved Dosage Schedules
            </h3>


            <div id="dosageList">

                <div class="empty">
                    Loading dosage schedules...
                </div>

            </div>

        </div>


    </div>



    <script>


        // ========================================
        // LOGIN CHECK
        // ========================================

        const loggedIn =
            localStorage.getItem("loggedIn");


        if (loggedIn !== "true") {

            window.location.href =
                "login.html";

        }



        // ========================================
        // ELEMENTS
        // ========================================

        const dosageForm =
            document.getElementById(
                "dosageForm"
            );


        const medicineName =
            document.getElementById(
                "medicineName"
            );


        const dose =
            document.getElementById(
                "dose"
            );


        const time =
            document.getElementById(
                "time"
            );


        const mealInstruction =
            document.getElementById(
                "mealInstruction"
            );


        const dosageList =
            document.getElementById(
                "dosageList"
            );


        const message =
            document.getElementById(
                "message"
            );



        // ========================================
        // SHOW MESSAGE
        // ========================================

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

            message.style.display =
                "block";


            setTimeout(() => {

                message.style.display =
                    "none";

            }, 3000);

        }



        // ========================================
        // LOAD MEDICINES
        // ========================================

        async function loadMedicines() {

            try {

                const response =
                    await fetch(
                        "/api/medicines"
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        "Failed to load medicines."
                    );

                }


                medicineName.innerHTML = `
                    <option value="">
                        Select Medicine
                    </option>
                `;


                data.medicines.forEach(
                    medicine => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            medicine.name;


                        option.textContent =
                            medicine.name;


                        medicineName.appendChild(
                            option
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Medicine loading error:",
                    error
                );


                medicineName.innerHTML = `
                    <option value="">
                        No medicines found
                    </option>
                `;

            }

        }



        // ========================================
        // LOAD DOSAGES
        // ========================================

        async function loadDosages() {

            try {

                const response =
                    await fetch(
                        "/api/dosage-schedules"
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        "Failed to load dosage schedules."
                    );

                }


                dosageList.innerHTML = "";


                if (
                    data.dosages.length === 0
                ) {

                    dosageList.innerHTML = `
                        <div class="empty">
                            No dosage schedules added yet.
                        </div>
                    `;

                    return;

                }


                data.dosages.forEach(
                    dosage => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "dosage-item";


                        item.innerHTML = `

                            <h4>
                                ${dosage.medicine_name}
                            </h4>

                            <p>
                                <strong>Dose:</strong>
                                ${dosage.dose}
                            </p>

                            <p>
                                <strong>Time:</strong>
                                ${dosage.time}
                            </p>

                            <p>
                                <strong>Meal:</strong>
                                ${dosage.meal_instruction}
                            </p>

                            <button
                                class="delete-btn"
                                onclick="deleteDosage(${dosage.id})">

                                Delete

                            </button>

                        `;


                        dosageList.appendChild(
                            item
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Dosage loading error:",
                    error
                );


                dosageList.innerHTML = `
                    <div class="empty">
                        Unable to load dosage schedules.
                    </div>
                `;

            }

        }



        // ========================================
        // ADD DOSAGE
        // ========================================

        dosageForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const medicine =
                    medicineName.value.trim();


                const doseValue =
                    dose.value.trim();


                const timeValue =
                    time.value;


                const mealValue =
                    mealInstruction.value;



                // VALIDATION

                if (
                    !medicine ||
                    !doseValue ||
                    !timeValue ||
                    !mealValue
                ) {

                    showMessage(
                        "Please fill in all fields.",
                        "error"
                    );

                    return;

                }



                try {

                    const response =
                        await fetch(
                            "/api/dosage-schedules",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    medicine_name:
                                        medicine,

                                    dose:
                                        doseValue,

                                    time:
                                        timeValue,

                                    meal_instruction:
                                        mealValue

                                })

                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        showMessage(
                            data.message ||
                            "Failed to save dosage.",
                            "error"
                        );

                        return;

                    }


                    showMessage(
                        "Dosage schedule saved successfully!",
                        "success"
                    );


                    dosageForm.reset();


                    await loadDosages();


                } catch (error) {

                    console.error(
                        "Add dosage error:",
                        error
                    );


                    showMessage(
                        "Server error. Please try again.",
                        "error"
                    );

                }

            }
        );



        // ========================================
        // DELETE DOSAGE
        // ========================================

        async function deleteDosage(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this dosage schedule?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/dosage-schedules/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    showMessage(
                        data.message ||
                        "Failed to delete dosage.",
                        "error"
                    );

                    return;

                }


                showMessage(
                    "Dosage schedule deleted successfully.",
                    "success"
                );


                await loadDosages();


            } catch (error) {

                console.error(
                    "Delete dosage error:",
                    error
                );


                showMessage(
                    "Server error. Please try again.",
                    "error"
                );

            }

        }



        // ========================================
        // INITIAL LOAD
        // ========================================

        loadMedicines();

        loadDosages();


    </script>


</body>

</html>
