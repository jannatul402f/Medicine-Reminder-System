<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adherence Analytics - Medicine Reminder</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f8fc;
            color: #183b56;
        }

        /* NAVBAR */
        nav {
            background: linear-gradient(135deg, #1769aa, #2995d6);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 20px;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            color: #1769aa;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #6c8494;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 7px 22px rgba(23,105,170,0.10);
        }

        .icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .card h3 {
            color: #607d8b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .number {
            font-size: 30px;
            font-weight: bold;
            color: #1769aa;
        }

        /* MAIN ANALYTICS */
        .analytics-box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 7px 25px rgba(23,105,170,0.10);
            text-align: center;
        }

        .analytics-box h2 {
            color: #1769aa;
            margin-bottom: 25px;
        }

        /* PROGRESS */
        .progress-container {
            width: 100%;
            max-width: 700px;
            margin: 20px auto;
        }

        .progress-bar {
            height: 30px;
            background: #e4edf2;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #1769aa, #2995d6);
            border-radius: 20px;
            transition: width 1s ease;
        }

        .percentage {
            font-size: 42px;
            font-weight: bold;
            color: #1769aa;
            margin-bottom: 15px;
        }

        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #eef8fd;
            color: #1769aa;
            font-weight: bold;
        }

        .refresh-btn {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #1769aa;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #125789;
        }

        #error {
            text-align: center;
            color: red;
            margin-top: 20px;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }
        }

        @media (max-width: 500px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .title h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        💊 Medicine Reminder System
    </div>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Home</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

</nav>


<div class="container">

    <div class="title">

        <h1>📊 Adherence Analytics</h1>

        <p>
            Track your medication-taking performance
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="cards">

        <div class="card">

            <div class="icon">💊</div>

            <h3>Total Records</h3>

            <div
                class="number"
                id="total">
                0
            </div>

        </div>


        <div class="card">

            <div class="icon">✅</div>

            <h3>Taken</h3>

            <div
                class="number"
                id="taken">
                0
            </div>

        </div>


        <div class="card">

            <div class="icon">❌</div>

            <h3>Missed</h3>

            <div
                class="number"
                id="missed">
                0
            </div>

        </div>


        <div class="card">

            <div class="icon">⏭️</div>

            <h3>Skipped</h3>

            <div
                class="number"
                id="skipped">
                0
            </div>

        </div>

    </div>


    <!-- ADHERENCE -->

    <div class="analytics-box">

        <h2>
            Overall Medication Adherence
        </h2>

        <div
            class="percentage"
            id="percentage">
            0%
        </div>


        <div class="progress-container">

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress">
                </div>

            </div>

        </div>


        <div
            class="status"
            id="status">
            Loading your adherence...
        </div>


        <button
            class="refresh-btn"
            onclick="loadAnalytics()">

            🔄 Refresh Analytics

        </button>

        <div id="error"></div>

    </div>

</div>


<script>

    /* LOGIN PROTECTION */

    if (
        localStorage.getItem("loggedIn") !== "true"
    ) {

        window.location.href = "login.html";

    }


    /* LOAD ANALYTICS */

    async function loadAnalytics() {

        try {

            const response =
                await fetch(
                    "/api/adherence-analytics"
                );

            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    "Analytics loading failed"
                );

            }


            const analytics =
                data.analytics;


            /* STATISTICS */

            document.getElementById("total")
                .textContent =
                analytics.total;


            document.getElementById("taken")
                .textContent =
                analytics.taken;


            document.getElementById("missed")
                .textContent =
                analytics.missed;


            document.getElementById("skipped")
                .textContent =
                analytics.skipped;


            /* PERCENTAGE */

            const percentage =
                analytics.adherenceRate;


            document.getElementById("percentage")
                .textContent =
                percentage + "%";


            /* PROGRESS BAR */

            document.getElementById("progress")
                .style.width =
                percentage + "%";


            /* STATUS */

            const status =
                document.getElementById("status");


            if (percentage >= 80) {

                status.textContent =
                    "🌟 Excellent! Your medication adherence is very good.";

            }

            else if (percentage >= 60) {

                status.textContent =
                    "👍 Good! Try to improve your medication routine.";

            }

            else if (percentage > 0) {

                status.textContent =
                    "⚠️ Your adherence is low. Try not to miss your doses.";

            }

            else {

                status.textContent =
                    "📋 No medication history available yet.";

            }


        } catch (error) {

            console.error(error);

            document.getElementById("error")
                .textContent =
                "❌ Unable to load analytics.";

            document.getElementById("status")
                .textContent =
                "Please make sure medication history is available.";

        }

    }


    /* LOGOUT */

    function logout() {

        localStorage.removeItem(
            "loggedIn"
        );

        localStorage.removeItem(
            "currentUser"
        );

        window.location.href =
            "login.html";

    }


    /* LOAD WHEN PAGE OPENS */

    loadAnalytics();

</script>

</body>
</html>
